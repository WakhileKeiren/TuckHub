/* =========================================================
   3. STATE
   ========================================================= */
const state = {
  vendor: null,
  view: "vendor",
  cart: JSON.parse(localStorage.getItem("cart") || "{}"),
  menu: JSON.parse(localStorage.getItem("menu") || "null"),
  orders: [],

  adminTab: "orders",
};

function saveCart(){ localStorage.setItem("cart", JSON.stringify(state.cart)); }
function saveMenu(){ localStorage.setItem("menu", JSON.stringify(state.menu)); }
function saveCustomerInfo(info){
  state.orderInfo = info;
  localStorage.setItem("customerInfo", JSON.stringify(info));
}

/* =========================================================
   4. FIREBASE SYNC
   ========================================================= */
async function loadMenuFromDB(){
  if(db){
    try{
      const snap = await db.ref("menu").get();
      if(snap.exists()){
        const remoteMenu = snap.val();
        // Check if remote menu has old broken paths, if so, override with new seed
        const firstItem = remoteMenu?.tuckhub?.[0];
        if(firstItem && firstItem.img && firstItem.img.startsWith("images/tuckhub/")){
          console.warn("⚠️ Old paths detected in Firebase — replacing with corrected seed");
          state.menu = SEED_MENU;
          saveMenu();
          db.ref("menu").set(SEED_MENU).catch(()=>{});
          return;
        }
        state.menu = remoteMenu;
        saveMenu();
        console.log("✅ Menu loaded from Firebase");
        return;
      }
    }catch(e){ console.warn("Menu DB read failed:", e); }
  }
  if(!state.menu || (state.menu?.tuckhub?.[0]?.img || "").startsWith("images/")){
    state.menu = SEED_MENU;
    saveMenu();
    if(db) db.ref("menu").set(SEED_MENU).catch(()=>{});
    console.log("📦 Menu seeded");
  }
}

function saveMenuToDB(){
  saveMenu();
  if(db) db.ref("menu").set(state.menu).catch(e => console.warn("Menu save failed:", e));
}

async function loadOrdersFromDB(){
  if(db){
    try{
      const snap = await db.ref("orders").get();
      if(snap.exists()){
        const val = snap.val();
        state.orders = Object.values(val).sort((a,b) => b.createdAt - a.createdAt);
        return;
      }
    }catch(e){ console.warn("Orders DB read failed:", e); }
  }
  state.orders = JSON.parse(localStorage.getItem("orders") || "[]").sort((a,b) => b.createdAt - a.createdAt);
}

async function placeOrder(order){
  order.createdAt = Date.now();
  order.id = "ORD-" + Date.now().toString(36).toUpperCase();
  state.orders.unshift(order);
  localStorage.setItem("orders", JSON.stringify(state.orders));
  if(db){
    try{ await db.ref("orders/" + order.id).set(order); }
    catch(e){ console.warn("Order upload failed:", e); }
  }
  return order;
}

async function updateOrder(id, patch){
  const idx = state.orders.findIndex(o => o.id === id);
  if(idx >= 0){
    state.orders[idx] = { ...state.orders[idx], ...patch };
    localStorage.setItem("orders", JSON.stringify(state.orders));
  }
  if(db){
    try{ await db.ref("orders/" + id).update(patch); }
    catch(e){ console.warn("Order update failed:", e); }
  }
}

function subscribeToOrders(cb){
  if(!db) return;
  db.ref("orders").on("value", snap => {
    if(snap.exists()){
      const val = snap.val();
      state.orders = Object.values(val).sort((a,b) => b.createdAt - a.createdAt);
      cb && cb();
    }
  });
}

/* =========================================================
   5. HELPERS
   ========================================================= */
const fmt = n => "E " + Number(n).toFixed(2);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg){
  document.querySelectorAll(".toast").forEach(t => t.remove());
  const t = document.createElement("div");
  t.className = "toast";
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}

function getCartItems(vendor){
  const c = state.cart[vendor] || {};
  return Object.entries(c).map(([id, qty]) => {
    const item = state.menu[vendor].find(m => m.id === id);
    if(!item) return null;
    return { ...item, qty };
  }).filter(Boolean);
}

function cartCount(vendor){
  const c = state.cart[vendor] || {};
  return Object.values(c).reduce((s,n) => s+n, 0);
}

function cartTotal(vendor){
  return getCartItems(vendor).reduce((s,i) => s + i.price * i.qty, 0);
}

function addToCart(vendor, id){
  if(!state.cart[vendor]) state.cart[vendor] = {};
  state.cart[vendor][id] = (state.cart[vendor][id] || 0) + 1;
  saveCart();
  toast("Added to cart");
  render();
}

function setQty(vendor, id, qty){
  if(!state.cart[vendor]) state.cart[vendor] = {};
  if(qty <= 0){ delete state.cart[vendor][id]; }
  else{ state.cart[vendor][id] = qty; }
  saveCart();
  render();
  if(document.getElementById("modalCart").classList.contains("open")) openCart();
}

function clearCart(vendor){
  state.cart[vendor] = {};
  saveCart();
  render();
}

function applyPromo(vendor){
  const code = (document.getElementById("promoInput")?.value || "").trim().toUpperCase();
  if(!code){ toast("Enter a promo code"); return; }
  const promo = PROMOS[code];
  if(!promo){ toast("Invalid promo code"); return; }
  state.promo = { code, ...promo };
  toast("Promo applied: " + promo.label);
  openCart();
}

function getDiscount(vendor){
  if(!state.promo) return 0;
  const sub = cartTotal(vendor);
  if(state.promo.type === "percent") return sub * state.promo.value / 100;
  if(state.promo.type === "flat") return Math.min(sub, state.promo.value);
  return 0;
}

/* =========================================================
   6. RENDER ROOT
   ========================================================= */
function render(){
  const app = document.getElementById("app");
  if(state.view === "vendor") app.innerHTML = renderVendorPicker();
  else if(state.view === "menu") app.innerHTML = renderMenuView();
  else if(state.view === "admin") app.innerHTML = renderAdmin();
  attachHandlers();
  if(state.view === "menu") renderCartButton();
}

      <div class="vendor-card vendor-tuckhub" onclick="selectVendor('tuckhub')">

        </div>

function togglePayMethod(){
  const method = document.querySelector('input[name="payMethod"]:checked').value;
  document.getElementById("momoPanel").style.display = method === "momo" ? "block" : "none";
  document.getElementById("payCashLabel").style.borderColor = method === "cash" ? "#059669" : "#E5EAF0";
  document.getElementById("payMoMoLabel").style.borderColor = method === "momo" ? "#1E40AF" : "#E5EAF0";
}

async function submitOrder(){
  const v = state.vendor;
  const name = document.getElementById("coName").value.trim();
  const hostel = document.getElementById("coHostel").value.trim();
  const room = document.getElementById("coRoom").value.trim();
  const phone = document.getElementById("coPhone").value.trim();
  const notes = document.getElementById("coNotes").value.trim();
  const method = document.querySelector('input[name="payMethod"]:checked').value;
  const momoRef = document.getElementById("coMomoRef")?.value.trim() || "";

  if(!name){ toast("Enter your name"); return; }
  if(!hostel){ toast("Enter your hostel"); return; }
  if(!room){ toast("Enter your room number"); return; }
  if(!/^\d{8}$/.test(phone)){ toast("Phone must be 8 digits"); return; }
  if(method === "momo" && !momoRef){ toast("Enter the MoMo transaction reference"); return; }

  saveCustomerInfo({ name, hostel, room, phone, notes });

  const items = getCartItems(v).map(i => ({ id:i.id, name:i.name, price:i.price, qty:i.qty, cat:i.cat }));
  const sub = cartTotal(v);
  const disc = getDiscount(v);
  const total = Math.max(0, sub - disc);

  const ahead = state.orders.filter(o => o.vendor === v && o.status !== "delivered").length;

  const order = {
    vendor: v,
    customer: { name, hostel, room, phone, notes },
    items,
    subtotal: sub,
    discount: disc,
    promo: state.promo?.code || null,
    total,
    payment: method,
    momoRef: method === "momo" ? momoRef : null,
    paid: false,
    status: "pending",
    positionAtOrder: ahead + 1,
  };

  const saved = await placeOrder(order);
  state.activeOrder = saved.id;

  clearCart(v);
  state.promo = null;

  document.getElementById("modalCheckout").classList.remove("open");
  showOrderConfirmation(saved);
}

      <div class="p-3 rounded-xl" style="background:#F5F7FA">
        <div class="font-semibold mb-1">🕐 Hours</div>
        <p style="color:#6B7A8F">Mon–Fri: 1–2pm, 6–9pm · Sat–Sun: 2–8pm</p>
      </div>
      <div class="text-center pt-3">
        <p class="text-xs" style="color:#94A3B8">Designed by
          <a href="https://wakhilekeiren.github.io/portfolio/" target="_blank" style="color:${accent};font-weight:600">Wakhile Keiren Mavimbela</a>
        </p>
      </div>
    </div>
  `;
  document.getElementById("modalInfoContent").innerHTML = content;
  document.getElementById("modalInfo").classList.add("open");
}

/* =========================================================
   13. ADMIN
   ========================================================= */
function openAdmin(){
  document.getElementById("modalAdminContent").innerHTML = `
    <div class="flex justify-between items-center mb-3">
      <h2 style="font-family:Fraunces,serif;font-size:1.4rem;font-weight:700;color:#000080">Admin Access</h2>
      <button class="btn btn-outline btn-sm" onclick="closeModals()"><i class="fas fa-times"></i></button>
    </div>
    <label class="text-xs font-semibold" style="color:#6B7A8F">ENTER PIN</label>
    <input id="adminPin" type="password" maxlength="4" style="margin-top:.4rem;text-align:center;font-size:1.4rem;letter-spacing:.5em" placeholder="••••"/>
    <button class="btn btn-primary w-full mt-4" onclick="checkAdminPin()">Unlock</button>
    <p class="text-center text-xs mt-3" style="color:#94A3B8">Default PIN: 2468</p>
  `;
  document.getElementById("modalAdmin").classList.add("open");
  setTimeout(() => document.getElementById("adminPin")?.focus(), 100);
}

function checkAdminPin(){
  const pin = document.getElementById("adminPin").value;
  if(pin !== ADMIN_PIN){ toast("Wrong PIN"); return; }
  state.view = "admin";
  closeModals();
  render();
}

function renderAdmin(){
  const tabs = [
    { id:"orders", label:"Orders", icon:"fa-list" },
    { id:"menu", label:"Menu", icon:"fa-book" },
    { id:"analytics", label:"Sales", icon:"fa-chart-line" },
  ];

  let body = "";
  if(state.adminTab === "orders") body = renderAdminOrders();
  else if(state.adminTab === "menu") body = renderAdminMenu();
  else body = renderAdminAnalytics();

  return `
  <div style="min-height:100vh;background:#F5F7FA">
    <div class="header-bar">
      <button class="btn btn-outline btn-sm" onclick="state.view='vendor';state.vendor=null;render()">
        <i class="fas fa-arrow-left"></i>
      </button>
      <div class="flex-1">
        <div class="font-bold" style="color:#000080;font-family:Fraunces,serif;font-size:1.1rem">Admin Panel</div>
        <div class="text-xs" style="color:#6B7A8F">Manage orders & menu</div>
      </div>
    </div>

    <div class="flex gap-1 px-3 py-2 bg-white border-b" style="border-color:#E5EAF0">
      ${tabs.map(t => `
        <button class="tab-btn ${state.adminTab === t.id ? 'active' : ''}" style="color:${state.adminTab === t.id ? '#000080' : '#6B7A8F'};font-weight:${state.adminTab === t.id ? '700' : '500'}" onclick="state.adminTab='${t.id}';render()">
          <i class="fas ${t.icon}"></i>${t.label}
        </button>
      `).join("")}
    </div>

    <div class="p-3 pb-10">${body}</div>
  </div>`;
}

function renderAdminOrders(){
  if(state.orders.length === 0){
    return `<div class="text-center py-10"><div style="font-size:3rem">📭</div><p class="mt-3" style="color:#6B7A8F">No orders yet</p></div>`;
  }

  const tuckOrders = state.orders.filter(o => o.vendor === "tuckhub");
  const fireOrders = state.orders.filter(o => o.vendor === "newflame");

  return `
    <div class="mb-4">
      <div class="section-title"><span>🛒</span> TuckHub (${tuckOrders.length})</div>
      ${tuckOrders.map(o => renderAdminOrderCard(o)).join("") || '<p class="text-xs" style="color:#94A3B8">No TuckHub orders</p>'}
    </div>
    <div class="mb-4">
      <div class="section-title"><span>🔥</span> New Flame (${fireOrders.length})</div>
      ${fireOrders.map(o => renderAdminOrderCard(o)).join("") || '<p class="text-xs" style="color:#94A3B8">No New Flame orders</p>'}
    </div>
  `;
}

function renderAdminOrderCard(o){
  const isHot = o.items.some(i => i.cat === "hot" || i.cat === "chicken" || i.cat === "burgers");
  const statusOpts = ["pending", "preparing", "ready", "delivered"];
  const items = o.items.map(i => `${i.qty}x ${i.name}`).join(", ");
  const accent = o.vendor === "newflame" ? "#C7321B" : "#000080";

  return `
    <div class="order-row ${isHot ? 'hot' : 'ready'} mb-3">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-bold" style="color:${accent};font-family:Fraunces,serif">#${o.id.slice(-6)}</div>
          <div class="text-xs" style="color:#6B7A8F">${new Date(o.createdAt).toLocaleString()}</div>
        </div>
        <div class="flex flex-col gap-1 items-end">
          ${isHot ? '<span class="chip chip-hot">🔥 Hot</span>' : '<span class="chip chip-ready">✨ Ready</span>'}
          ${o.paid ? '<span class="chip chip-paid">Paid</span>' : '<span class="chip chip-unpaid">Unpaid</span>'}
        </div>
      </div>
      <div class="text-xs" style="color:#6B7A8F">${esc(items)}</div>
      <div class="text-xs"><strong>${esc(o.customer.name)}</strong> · ${esc(o.customer.hostel)} ${esc(o.customer.room)} · ${esc(o.customer.phone)}</div>
      ${o.customer.notes ? `<div class="text-xs italic" style="color:#92400E">📝 ${esc(o.customer.notes)}</div>` : ""}
      ${o.momoRef ? `<div class="text-xs" style="color:#075985">MoMo Ref: ${esc(o.momoRef)}</div>` : ""}
      <div class="flex justify-between items-center pt-2 border-t" style="border-color:#F0F3F7">
        <span class="font-bold">${fmt(o.total)}</span>
        <span class="text-xs" style="color:#6B7A8F">${o.payment.toUpperCase()}</span>
      </div>
      <div class="flex gap-2 flex-wrap">
        <select onchange="updateOrder('${o.id}',{status:this.value})" style="flex:1;padding:.4rem;font-size:.8rem">
          ${statusOpts.map(s => `<option value="${s}" ${o.status === s ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join("")}
        </select>
        <button class="btn btn-sm ${o.paid ? 'btn-outline' : 'btn-primary'}" onclick="updateOrder('${o.id}',{paid:${!o.paid}}).then(()=>render())">
          ${o.paid ? 'Mark Unpaid' : 'Mark Paid'}
        </button>
        <a href="https://wa.me/${o.customer.phone.replace(/^0/, '268')}" target="_blank" class="btn btn-outline btn-sm" style="text-decoration:none"><i class="fab fa-whatsapp"></i></a>
      </div>
    </div>
  `;
}

function renderAdminMenu(){
  const v = state.vendor || "tuckhub";
  const items = state.menu[v] || [];
  return `
    <div class="flex gap-2 mb-3">
      <button class="btn btn-sm ${state.vendor === 'tuckhub' ? 'btn-primary' : 'btn-outline'}" style="flex:1" onclick="state.vendor='tuckhub';render()">TuckHub</button>
      <button class="btn btn-sm ${state.vendor === 'newflame' ? 'btn-fire' : 'btn-outline-fire'}" style="flex:1" onclick="state.vendor='newflame';render()">New Flame</button>
    </div>

    <button class="btn btn-primary w-full mb-3" onclick="addNewItem()"><i class="fas fa-plus"></i> Add New Item</button>

    ${items.map(item => `
      <div class="admin-item mb-2">
        <div class="flex-1">
          <div class="font-semibold text-sm">${esc(item.name)}</div>
          <div class="text-xs" style="color:#6B7A8F">${fmt(item.price)} · ${item.cat} ${item.available === false ? '· <span style="color:#DC2626">Out of Stock</span>' : ''}</div>
        </div>
        <button class="btn btn-sm btn-outline" onclick="toggleStock('${item.id}')">
          ${item.available === false ? '<i class="fas fa-check"></i>' : '<i class="fas fa-ban"></i>'}
        </button>
        <button class="btn btn-sm btn-outline" onclick="editItem('${item.id}')"><i class="fas fa-pen"></i></button>
        <button class="btn btn-sm btn-outline" style="color:#DC2626;border-color:#DC2626" onclick="deleteItem('${item.id}')"><i class="fas fa-trash"></i></button>
      </div>
    `).join("") || '<p class="text-center py-6" style="color:#94A3B8">No items</p>'}
  `;
}

function renderAdminAnalytics(){
  const now = Date.now();
  const day = 24*60*60*1000;
  const today = state.orders.filter(o => o.createdAt > now - day);
  const week = state.orders.filter(o => o.createdAt > now - 7*day);
  const month = state.orders.filter(o => o.createdAt > now - 30*day);

  const sum = arr => arr.reduce((s,o) => s + (o.paid ? o.total : 0), 0);
  const count = arr => arr.length;

  const itemCounts = {};
  state.orders.forEach(o => o.items.forEach(i => {
    itemCounts[i.name] = (itemCounts[i.name] || 0) + i.qty;
  }));
  const topItems = Object.entries(itemCounts).sort((a,b) => b[1] - a[1]).slice(0, 5);

  return `
    <div class="grid grid-cols-2 gap-3 mb-4">
      <div class="stat-card"><div class="stat-label">Today</div><div class="stat-num">${fmt(sum(today))}</div><div class="text-xs" style="color:#6B7A8F">${count(today)} orders</div></div>
      <div class="stat-card"><div class="stat-label">This Week</div><div class="stat-num">${fmt(sum(week))}</div><div class="text-xs" style="color:#6B7A8F">${count(week)} orders</div></div>
      <div class="stat-card"><div class="stat-label">This Month</div><div class="stat-num">${fmt(sum(month))}</div><div class="text-xs" style="color:#6B7A8F">${count(month)} orders</div></div>
      <div class="stat-card"><div class="stat-label">Unpaid</div><div class="stat-num">${state.orders.filter(o => !o.paid).length}</div><div class="text-xs" style="color:#6B7A8F">need confirmation</div></div>
    </div>

    <div class="section-title">Top Items</div>
    <div class="stat-card">
      ${topItems.map(([name, qty]) => `
        <div class="flex justify-between py-1 text-sm">
          <span>${esc(name)}</span>
          <span class="font-bold">${qty} sold</span>
        </div>
      `).join("") || '<p class="text-xs" style="color:#94A3B8">No data yet</p>'}
    </div>

    <div class="section-title">Revenue by Vendor</div>
    <div class="stat-card">
      <div class="flex justify-between py-1 text-sm"><span>🛒 TuckHub</span><span class="font-bold">${fmt(sum(state.orders.filter(o => o.vendor === 'tuckhub')))}</span></div>
      <div class="flex justify-between py-1 text-sm"><span>🔥 New Flame</span><span class="font-bold">${fmt(sum(state.orders.filter(o => o.vendor === 'newflame')))}</span></div>
    </div>
  `;
}

/* =========================================================
   14. ADMIN ACTIONS
   ========================================================= */
function toggleStock(id){
  const v = state.vendor;
  const item = state.menu[v].find(i => i.id === id);
  if(!item) return;
  item.available = item.available === false ? true : false;
  saveMenuToDB();
  toast(item.available === false ? "Marked out of stock" : "Back in stock");
  render();
}

function editItem(id){
  const v = state.vendor;
  const item = state.menu[v].find(i => i.id === id);
  if(!item) return;
  const name = prompt("Item name:", item.name);
  if(name === null) return;
  const price = prompt("Price (E):", item.price);
  if(price === null) return;
  const cat = prompt("Category (" + CATEGORIES[v].map(c => c.id).join("/") + "):", item.cat);
  if(cat === null) return;
  item.name = name.trim() || item.name;
  item.price = parseFloat(price) || item.price;
  item.cat = cat.trim() || item.cat;
  saveMenuToDB();
  toast("Item updated");
  render();
}

function addNewItem(){
  const v = state.vendor;
  const name = prompt("New item name:");
  if(!name) return;
  const price = prompt("Price (E):");
  if(!price) return;
  const cat = prompt("Category (" + CATEGORIES[v].map(c => c.id).join("/") + "):", CATEGORIES[v][0].id);
  if(!cat) return;
  const emoji = prompt("Emoji (optional):", "🍽️") || "🍽️";
  const id = name.toLowerCase().replace(/[^a-z0-9]/g, "-") + "-" + Date.now().toString(36).slice(-4);
  state.menu[v].push({ id, name: name.trim(), price: parseFloat(price), cat: cat.trim(), emoji, available: true });
  saveMenuToDB();
  toast("Item added");
  render();
}

function deleteItem(id){
  if(!confirm("Delete this item?")) return;
  const v = state.vendor;
  state.menu[v] = state.menu[v].filter(i => i.id !== id);
  saveMenuToDB();
  toast("Item deleted");
  render();
}

/* =========================================================
   15. UTILITIES
   ========================================================= */
function selectVendor(v){
  state.vendor = v;
  state.view = "menu";
  render();
}

function closeModals(){
  document.querySelectorAll(".modal-overlay").forEach(m => m.classList.remove("open"));
}

function attachHandlers(){
  document.querySelectorAll(".modal-overlay").forEach(m => {
    m.addEventListener("click", (e) => { if(e.target === m) closeModals(); });
  });
}

/* =========================================================
   16. PWA MANIFEST
   ========================================================= */
(function setupPWA(){
  const manifest = {
    name: "TuckHub & New Flame",
    short_name: "TuckHub",
    start_url: ".",
    display: "standalone",
    background_color: "#F5F7FA",
    theme_color: "#000080",
    icons: [
      { src: "images/logo-tuckhub.jpg", sizes: "192x192", type: "image/jpeg" },
      { src: "images/logo-tuckhub.jpg", sizes: "512x512", type: "image/jpeg" }
    ]
  };
  const blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
  const link = document.createElement("link");
  link.rel = "manifest";
  link.href = URL.createObjectURL(blob);
  document.head.appendChild(link);
})();

/* =========================================================
   17. BOOT
   ========================================================= */
async function boot(){
  render();
  await loadMenuFromDB();
  await loadOrdersFromDB();
  subscribeToOrders(() => { if(state.view === "admin") render(); });
  render();
  console.log("🚀 TuckHub ready");
}

boot();

const mo = new MutationObserver(() => {
  const anyOpen = document.querySelector(".modal-overlay.open");
  document.body.style.overflow = anyOpen ? "hidden" : "";
});
document.querySelectorAll(".modal-overlay").forEach(m => mo.observe(m, { attributes: true, attributeFilter: ["class"] }));
</script>
